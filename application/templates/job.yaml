{{- if (.Values.job).enabled }}
{{- range $name, $job := .Values.job.jobs }}
{{- $appLabels := include "application.labels" $ | fromYaml | default dict }}
{{- $additionalLabels := $job.additionalLabels | default dict }}
{{- $mergedLabels := merge $appLabels $additionalLabels }}
---
{{ if $.Capabilities.APIVersions.Has "batch/v1/Job" -}}
apiVersion: batch/v1
{{- else -}}
apiVersion: batch/v1beta1
{{- end }}
kind: Job
metadata:
  labels:
    {{- toYaml $mergedLabels | nindent 4 }}
  {{- with $job.additionalPodAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ $name }}
  namespace: {{ template "application.namespace" $ }}
spec:
  {{- with $job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with $job.parallelism }}
  parallelism: {{ . }}
  {{- end }}
  {{- with $job.completions }}
  completions: {{ . }}
  {{- end }}
  {{- with $job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  {{- if not (kindIs "invalid" $job.backoffLimit) }}
  backoffLimit: {{ $job.backoffLimit }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- toYaml $mergedLabels | nindent 8 }}
      {{- with $job.additionalPodAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if $.Values.rbac.enabled }}
      {{- if $.Values.rbac.serviceAccount.name }}
      serviceAccountName: {{ $.Values.rbac.serviceAccount.name }}
      {{- else }}
      serviceAccountName: {{ template "application.name" $ }}
      {{- end }}
      {{- end }}
      {{- with $job.initContainers }}
      initContainers:
      {{- range $name, $initContainer := . }}
      - name: {{ $name }}
        {{- include "job.image" . | indent 8 }}
        {{- with $initContainer.imagePullPolicy }}
        imagePullPolicy: {{ . }}
        {{ end }}
        {{- with $initContainer.env }}
        env:
        {{- range $key, $value := . }}
        - name: {{ include "application.tplvalues.render" ( dict "value" $key "context" $ ) }}
{{ include "application.tplvalues.render" ( dict "value" $value "context" $ ) | indent 10 }}
        {{- end }}
        {{- end }}
        {{- with $initContainer.lifecycle }}
        lifecycle:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $initContainer.envFrom }}
        envFrom:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $initContainer.command }}
        command:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $initContainer.args }}
        args:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $initContainer.securityContext }}
        securityContext:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $initContainer.resources }}
        resources:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $initContainer.volumeMounts }}
        volumeMounts:
{{ toYaml . | indent 10 }}
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ $name }}
        {{- include "job.image" . | indent 8 }}
        {{- with $job.image.imagePullPolicy }}
        imagePullPolicy: {{ . }}
        {{ end }}
        {{- with $job.env }}
        env:
        {{- range $key, $value := $job.env }}
        - name: {{ include "application.tplvalues.render" ( dict "value" $key "context" $ ) }}
{{ include "application.tplvalues.render" ( dict "value" $value "context" $ ) | indent 10 }}
        {{- end }}
        {{- end }}
        {{- with $job.lifecycle }}
        lifecycle:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $job.envFrom }}
        envFrom:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $job.command }}
        command:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $job.args }}
        args:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $job.containerSecurityContext }}
        securityContext:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $job.resources }}
        resources:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with $job.volumeMounts }}
        volumeMounts:
{{ toYaml . | indent 10 }}
        {{- end }}
      {{- with $job.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $job.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $job.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $job.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $job.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $job.securityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if $job.restartPolicy }}
      restartPolicy: {{ $job.restartPolicy }}
      {{ else }}
      restartPolicy: OnFailure
      {{ end }}
      {{- with $job.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{ end }}
      {{- with $job.volumes }}
      volumes:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
{{- end }}
